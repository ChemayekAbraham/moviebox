name: Release APK

# Push a tag like "v1.4" to build a signed APK and publish it as a GitHub Release.
# Installed apps check the latest Release and offer the update automatically.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.4)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Pinned: this image ships with the Android SDK preinstalled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Work out version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version $V"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || { echo "::error::Android SDK not found on runner"; exit 1; }
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret (see README → Releasing updates)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > moviebox-release.jks

      - name: Build signed APK
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          KEYSTORE_FILE: moviebox-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MovieBox-${APP_VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Update ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: out/MovieBox-${{ steps.ver.outputs.version }}.apk

      - name: Clean up key
        if: always()
        run: rm -f moviebox-release.jks
