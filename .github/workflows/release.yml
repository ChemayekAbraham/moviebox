name: Release APK

# Push a tag like "v1.4" to build a signed APK and publish it as a GitHub Release.
# Installed apps check the latest Release and offer the update automatically.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.4)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Pinned: this image ships with the Android SDK preinstalled
    runs-on: ubuntu-24.04
    env:
      # Optional backup host; the Codeberg step is skipped when this secret is not set
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need tags so re-runs use the tagged commit's notes

      - name: Work out version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version $V"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || { echo "::error::Android SDK not found on runner"; exit 1; }
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret (see README → Releasing updates)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > moviebox-release.jks

      - name: Build signed APK
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          KEYSTORE_FILE: moviebox-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ShirleyFlix-${APP_VERSION}.apk"

      - name: Write release notes
        # "What's new" shown in the app = the message of the tagged commit
        run: |
          V="${{ steps.ver.outputs.version }}"
          # Prefer the tagged commit (so manual re-runs keep the original "What's new")
          git log -1 --format=%B "v${V}" > notes.md 2>/dev/null || git log -1 --format=%B > notes.md
          echo "" >> notes.md
          echo "_Install: download ShirleyFlix-${{ steps.ver.outputs.version }}.apk below._" >> notes.md

      # Public, releases-only repo that installed apps check (no source code is published there)
      - name: Publish to public updates repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ChemayekAbraham/moviebox_updates
          token: ${{ secrets.UPDATES_REPO_TOKEN }}
          tag_name: v${{ steps.ver.outputs.version }}
          name: Update ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: out/ShirleyFlix-${{ steps.ver.outputs.version }}.apk

      # Transition: apps on 1.3 still check this repo. Harmless once this repo is private.
      - name: Publish to this repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Update ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: out/ShirleyFlix-${{ steps.ver.outputs.version }}.apk

      # Independent backup: if GitHub removes moviebox_updates, apps fall back to Codeberg.
      # Never fails the release.
      - name: Publish to Codeberg (backup)
        if: env.CODEBERG_TOKEN != ''
        continue-on-error: true
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          API="https://codeberg.org/api/v1/repos/ChemayekAbraham/moviebox_updates"
          APK="out/ShirleyFlix-${V}.apk"
          AUTH="Authorization: token $CODEBERG_TOKEN"
          fail() { echo "::warning title=Codeberg backup not updated::$1"; exit 1; }

          # Reuse the release if this version was published before, otherwise create it
          ID=$(curl -s -H "$AUTH" "$API/releases/tags/v${V}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null)
          if [ -z "$ID" ]; then
            BODY=$(python3 -c 'import json,os; print(json.dumps({"tag_name":"v"+os.environ["V"],"name":"Update "+os.environ["V"],"body":open("notes.md").read(),"target_commitish":"main"}))')
            RESP=$(curl -s -w '\n%{http_code}' -X POST "$API/releases" -H "$AUTH" -H "Content-Type: application/json" -d "$BODY")
            CODE=$(echo "$RESP" | tail -n1); JSON=$(echo "$RESP" | sed '$d')
            [ "$CODE" = "201" ] || fail "Create release failed (HTTP $CODE): $JSON  -  check that Releases are enabled in the Codeberg repo settings and the token has repository read/write."
            ID=$(echo "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi

          # Replace an existing APK with the same name, then upload
          OLD=$(curl -s -H "$AUTH" "$API/releases/$ID/assets" | python3 -c 'import json,sys,os; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"]=="ShirleyFlix-"+os.environ["V"]+".apk"))' 2>/dev/null)
          for A in $OLD; do curl -s -X DELETE -H "$AUTH" "$API/releases/$ID/assets/$A" > /dev/null; done
          CODE=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST "$API/releases/$ID/assets?name=ShirleyFlix-${V}.apk" -H "$AUTH" -F "attachment=@${APK}")
          [ "$CODE" = "201" ] || fail "APK upload failed (HTTP $CODE): $(cat /tmp/up.json)"
          echo "Published v${V} to Codeberg (release $ID)"

      - name: Clean up key
        if: always()
        run: rm -f moviebox-release.jks
